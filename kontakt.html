<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<meta name="description" content="Nimm Kontakt mit CSSGuru auf.">
<title>Kontakt — CSSGuru</title>
<link rel="stylesheet" href="/components/shared.css">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font:16px/1.75 system-ui,sans-serif;background:#090b12;color:#eef;margin:0}
a{color:#b49cff}
p{color:#c3c7d5}
h1{line-height:1.25}
.legal-content{max-width:820px;margin:auto;padding:32px 20px}
.contact-form{margin-top:28px}
.contact-form label{display:block;margin:0 0 18px;color:#c3c7d5}
.contact-form input,.contact-form textarea{display:block;width:100%;margin-top:7px;padding:12px 14px;border:1px solid #ffffff25;border-radius:7px;background:#111522;color:#eef;font:inherit}
.contact-form input:focus,.contact-form textarea:focus{outline:2px solid #a78bfa;border-color:#a78bfa}
.contact-form textarea{min-height:170px;resize:vertical}
.contact-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}
.contact-submit{padding:11px 18px;border:1px solid #a78bfa;border-radius:7px;background:#a78bfa;color:#090b12;font:inherit;font-weight:650;cursor:pointer}
.contact-back{text-decoration:none}
.contact-note{margin-top:18px;font-size:14px;color:#9299ad}
</style>
</head>
<body>
<div data-csguru-header></div>
<main class="legal-content">
<h1>Kontakt</h1>
<p>Du hast eine Frage oder möchtest etwas zu CSSGuru mitteilen? Schreib uns eine Nachricht.</p>
<form class="contact-form" id="contactForm">
<label for="subject">Betreff
<input id="subject" name="subject" type="text" placeholder="Worum geht es?" required>
</label>
<label for="email">Deine E-Mail-Adresse
<input id="email" name="email" type="email" placeholder="name@beispiel.de" required>
</label>
<label for="message">Nachricht
<textarea id="message" name="message" placeholder="Schreibe hier deine Nachricht ..." required></textarea>
</label>
<div class="contact-actions">
<button class="contact-submit" type="submit">E-Mail vorbereiten&nbsp; →</button>
<a class="contact-back" href="index.html">Zurück zu CSSGuru</a>
</div>
<p class="contact-note">Beim Absenden öffnet sich dein E-Mail-Programm mit deiner Nachricht an info@cssguru.de. Dort kannst du sie noch prüfen und versenden.</p>
</form>
</main>
<div data-csguru-footer></div>
<script src="/components/include.js" defer></script>
<script>
document.getElementById('contactForm').addEventListener('submit', function(event) {
  event.preventDefault();
  const subject = document.getElementById('subject').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();
  const body = 'Absender: ' + email + '\n\n' + message;
  window.location.href = 'mailto:info@cssguru.de?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
});
</script>
</body>
</html>
