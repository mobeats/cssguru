<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt — CSSGuru</title>
<link rel="stylesheet" href="/components/shared.css">
<style>
  body{font:16px/1.7 system-ui;background:#090b12;color:#eef;margin:0}a{color:#b49cff}p,li{color:#c3c7d5}h1,h2{line-height:1.25}h2{margin-top:2em;font-size:1.2rem}h3{font-size:1rem;margin-top:1.4em}.legal-content{max-width:760px;margin:auto;padding:40px 20px}
  .contact-block{background:#f5f2f0;color:#222;padding:32px 32px;border-radius:10px;margin-top:20px}.contact-block h1{font-size:2rem;color:#111;margin:0 0 1em}.contact-block .contact-details{font-size:.95rem;color:#444;line-height:1.9}.contact-block .contact-details p{margin:0 0 1em}.contact-block .contact-email{color:#a58bff;text-decoration:none}.contact-item{padding:14px 0;border-bottom:1px solid #e0ddd8}.contact-item:last-of-type{border-bottom:0}.contact-item strong{display:inline-block;font-weight:800;align-self:flex-start;color:#111}
  .contact-form{margin-top:24px}.contact-form label{display:grid;gap:6px;color:#555;font-size:.9rem;font-weight:600}.contact-form input,.contact-form textarea{width:100%;border:1px solid #ccc;border-radius:6px;background:#fff;color:#222;padding:11px 12px;font:14px system-ui,sans-serif;outline:none}.contact-form input:focus,.contact-form textarea:focus{border-color:#a58bff;box-shadow:0 0 0 3px #a58bff18}.contact-form .actions{display:flex;align-items:center;gap:16px;background:#090b12;padding:14px 18px;border-radius:8px}.contact-submit{border:0;border-radius:6px;padding:10px 16px;background:#a58bff;color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}.contact-note{font-size:.8rem;color:#777;text-align:center;margin:12px 0 0}
</style>
</head>
<body>
<div data-csguru-header></div>
<main class="legal-content">
  <h1>Kontakt</h1>
  <p>Frage hast du? Schreib uns eine Nachricht.</p>

  <section class="contact-block">
    <h2>Anschrift</h2>
    <p class="contact-details">
      <strong>Artur Goldmann</strong><br>
      Tribünenweg 34 F<br>
      22111 Hamburg<br>
      Deutschland
    </p>
  </section>

  <section class="contact-item">
    <strong>E‑Mail</strong>
    <a class="contact-email" href="mailto:info@cssguru.de">info@cssguru.de</a>
  </section>

  <form class="contact-form" id="contactForm">
    <label for="subject">Betreff</label>
    <input id="subject" name="subject" type="text" placeholder="Worum geht es?" required>
    <label for="email">Deine E-Mail-Adresse</label>
    <input id="email" name="email" type="email" placeholder="name@beispiel.de" required>
    <label for="message">Nachricht</label>
    <textarea id="message" name="message" placeholder="Schreibe hier deine Nachricht ..." required></textarea>
    <div class="actions">
      <button class="contact-submit" type="submit">E-Mail vorbereiten →</button>
      <a class="contact-close" href="index.html">Zurück zu CSSGuru</a>
    </div>
    <p class="contact-note">Beim Absenden öffnet sich dein E-Mail-Programm mit deiner Nachricht an info@cssguru.de.</p>
  </form>
</main>
<div data-csguru-footer></div>
<script src="/components/include.js" defer></script>
<script>
  document.getElementById('contactForm').addEventListener('submit', function(event) {
    event.preventDefault();
    const subject = document.getElementById('subject').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();
    const body = 'Von: ' + email + '\n\n' + message;
    window.location.href = 'mailto:info@cssguru.de?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  });
</script>
</body>
</html>
